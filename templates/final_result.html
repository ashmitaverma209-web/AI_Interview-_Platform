<!DOCTYPE html>
<html>
<head>
    <title>Final Interview Report</title>

    <style>

        body{
            margin:0;
            padding:0;
            background:#eef4ff;
            font-family:Arial,sans-serif;
        }

        .container{
            width:80%;
            max-width:900px;
            margin:40px auto;
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,.15);
        }

        h1{
            text-align:center;
            color:#0d47a1;
            margin-bottom:30px;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:20px;
        }

        .card{
            background:#f8fbff;
            padding:20px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 5px 15px rgba(0,0,0,.1);
        }

        .card h2{
            color:#1565c0;
        }

        .score{
            font-size:35px;
            font-weight:bold;
            color:#2e7d32;
        }

        .result{
            margin-top:30px;
            text-align:center;
            font-size:28px;
            font-weight:bold;
            color:#d32f2f;
        }

        .buttons{
            margin-top:35px;
            display:flex;
            justify-content:center;
            gap:20px;
        }

        .btn{
            background:#1565c0;
            color:white;
            text-decoration:none;
            padding:15px 30px;
            border-radius:10px;
            font-size:18px;
        }

        .btn:hover{
            background:#0d47a1;
        }

    </style>

</head>

<body>

<div class="container">

<h1>🎯 Final Interview Report</h1>

<div class="cards">

<div class="card">
<h2>HR Score</h2>
<p class="score">{{ hr }}/10</p>
</div>

<div class="card">
<h2>Technical Score</h2>
<p class="score">{{ technical }}/10</p>
</div>

<div class="card">
<h2>Coding Score</h2>
<p class="score">{{ coding }}/10</p>
</div>

<div class="card">
<h2>ATS Score</h2>
<p class="score">{{ ats }}/100</p>
</div>

</div>

<div class="result">

Overall Percentage :
{{ percentage }} %

<br><br>

Result :
{{ status }}

</div>

<div class="buttons">

<a href="/dashboard" class="btn">
Back to Dashboard
</a>

<a href="/download_report" class="btn">
📄Download PDF
</a>
</div>

<div class="ai-report">
    <h2>🤖 AI Career Recommendation</h2>
    <div class = "report-box">
        {{ ai_report|safe }}
    </div>


</div>

</div>

</body>
</html>
