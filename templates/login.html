{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="form-box">

<h1>Login</h1>

<form action="/login" method="POST">

    <input type="email"
           name="email"
           placeholder="Email"
           required>

    <input type="password"
           name="password"
           placeholder="Password"
           required>

    <button type="submit">
        Login
    </button>

</form>

</div>

{% endblock %}
