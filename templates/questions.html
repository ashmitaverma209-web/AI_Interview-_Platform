<!DOCTYPE html>
<html>
<head>
    <title>AI Questions</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f6f9;
            padding:30px;
        }

        h1{
            text-align:center;
            color:#1e3a8a;
        }

        .question{
            background:white;
            margin:15px 0;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
            line-height:1.8;
            white-space:pre-wrap;
        }

        a{
            text-decoration:none;
        }

        button{
            padding:10px 20px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }
    </style>
</head>

<body>

<h1>🤖 AI Generated Questions</h1>

<div class="question">
   {{ questions }}
</div>

<br>

<a href="/dashboard">
    <button>⬅ Back to Dashboard</button>
</a>

</body>
</html>
